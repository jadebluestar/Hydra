[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydra"
version = "0.1.0"
description = "Production-grade API Gateway and Developer Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "redis[asyncio]>=5.2.0",
    "structlog>=24.4.0",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "anyio[trio]>=4.7.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[tool.hatch.build.targets.wheel]
# This is a service, not a library. Hatchling packages no source —
# pip install . installs dependencies only. The app runs from the project root.
# bypass-selection skips hatchling's file auto-detection entirely; without it,
# hatchling errors out ("unable to determine which files to ship") because
# packages = [] alone isn't enough to produce an intentionally-empty wheel.
bypass-selection = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "infra: requires PostgreSQL and Redis to be running",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
