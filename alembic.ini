# ── Alembic Configuration ──────────────────────────────────────────────────────
# Run migrations from the project root: alembic upgrade head
# Generate a new migration:            alembic revision --autogenerate -m "description"
# Roll back one migration:             alembic downgrade -1
# Show pending migrations:             alembic current / alembic history
# Generate SQL script (no DB):         alembic upgrade head --sql

[alembic]
# Where Alembic looks for env.py, script.py.mako, and versions/
script_location = alembic

# Adds the project root to sys.path when running alembic CLI commands.
# This makes 'from core.config import ...' work inside env.py.
prepend_sys_path = .

version_path_separator = os

# The real DATABASE_URL is loaded from application settings in env.py.
# This placeholder prevents Alembic from erroring before env.py overrides it.
sqlalchemy.url = postgresql+asyncpg://placeholder/placeholder

# ── Post-write hooks ──────────────────────────────────────────────────────────
# Automatically format new migration files after autogenerate creates them.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# ── Logging ───────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
